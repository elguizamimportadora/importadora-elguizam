<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Importadora Elguizam — Catálogo de Pedidos</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#fff;color:#1a1a1a;font-size:14px}

/* HEADER */
.hdr{background:#fff;border-bottom:2px solid #1a3a8c;padding:.75rem 1rem;display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:sticky;top:0;z-index:100}
.logo-img{height:48px;width:auto;flex-shrink:0}
.search-wrap{flex:1;min-width:140px}
.search-wrap input{width:100%;padding:8px 12px;border:1.5px solid #ddd;border-radius:8px;font-size:14px;background:#f9f9f7}
.search-wrap input:focus{outline:none;border-color:#1a3a8c}
.cbtn{padding:8px 14px;background:#1a3a8c;color:#fff;border:none;border-radius:8px;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:6px;font-weight:500;white-space:nowrap}
.cbtn:hover{background:#122870}
.cbadge{background:#fff;color:#1a3a8c;border-radius:99px;font-size:11px;font-weight:700;padding:1px 6px}
.update-bar{background:#e8f0fb;border-bottom:1px solid #b3c6f0;padding:4px 1rem;font-size:11px;color:#1a3a8c;text-align:right}

/* LAYOUT DESKTOP */
.layout{display:flex;min-height:calc(100vh - 68px)}
.side{width:180px;flex-shrink:0;padding:1rem;background:#fff;border-right:1px solid #e5e5e2;overflow-y:auto;position:sticky;top:68px;height:calc(100vh - 68px)}
.side h4{font-size:10px;font-weight:600;color:#aaa;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.sb{display:block;width:100%;text-align:left;padding:7px 10px;border-radius:8px;border:none;background:transparent;font-size:12px;color:#555;cursor:pointer;margin-bottom:2px;line-height:1.35}
.sb:hover{background:#E8EEF9;color:#1a3a8c}
.sb.on{background:#E8EEF9;color:#1a3a8c;font-weight:600}
.list{flex:1;padding:1rem;overflow-y:auto;max-height:calc(100vh - 68px)}
.ctitle{font-size:10px;font-weight:600;color:#888;padding:12px 0 6px;border-bottom:1px solid #eee;margin-bottom:2px;letter-spacing:.04em;text-transform:uppercase}
.ctitle:first-child{padding-top:0}
.prow{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #f0f0ee}
.prow:last-child{border:none}
.pcode{font-size:10px;color:#aaa;font-family:monospace;min-width:110px;flex-shrink:0}
.pname{font-size:12px;color:#1a1a1a;flex:1;line-height:1.35}
.pprice{font-size:13px;font-weight:600;color:#1a6621;min-width:52px;text-align:right;flex-shrink:0}
.qctrl{display:flex;align-items:center;gap:3px;flex-shrink:0}
.qctrl button{width:28px;height:28px;border:1px solid #ddd;background:#f9f9f7;border-radius:6px;cursor:pointer;font-size:16px;color:#333;display:flex;align-items:center;justify-content:center}
.qctrl button:hover{background:#eee}
.qctrl span{min-width:22px;text-align:center;font-size:13px;font-weight:600}
.abtn{padding:6px 12px;background:#fff;border:1px solid #1a3a8c;border-radius:6px;font-size:12px;cursor:pointer;color:#1a3a8c;flex-shrink:0;font-weight:500}
.abtn:hover{background:#E8EEF9}
.empty-msg{font-size:13px;color:#aaa;padding:2rem;text-align:center}
.loading{font-size:13px;color:#1a3a8c;padding:2rem;text-align:center}

/* CART */
.cart-panel{width:0;overflow:hidden;transition:width .2s;border-left:1px solid #e5e5e2;background:#fff}
.cart-panel.open{width:220px;flex-shrink:0}
.cart-inner{width:220px;padding:.875rem;display:flex;flex-direction:column;gap:8px;height:calc(100vh - 68px);overflow-y:auto}
.cart-inner h4{font-size:13px;font-weight:600;color:#1a3a8c}
.ci{font-size:11px;color:#555;display:flex;justify-content:space-between;gap:4px;padding:5px 0;border-bottom:1px solid #eee}
.ci-n{flex:1;line-height:1.3}
.ci-v{font-weight:600;color:#1a1a1a;white-space:nowrap}
.ctotal{font-size:14px;font-weight:600;display:flex;justify-content:space-between;padding-top:8px;border-top:1px solid #ddd;margin-top:4px}
.sbtn{width:100%;padding:10px;background:#1a3a8c;color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;margin-top:4px}
.sbtn:hover{background:#122870}
.empty-cart{font-size:12px;color:#bbb;text-align:center;padding:2rem 0}
.success-msg{background:#e8f0fb;border:1px solid #b3c6f0;border-radius:8px;padding:1rem;text-align:center;font-size:13px;color:#1a3a8c;display:none}

/* FORM OVERLAY */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;align-items:center;justify-content:center;padding:1rem}
.overlay.show{display:flex}
.fbox{background:#fff;border-radius:12px;padding:1.5rem;width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px;box-shadow:0 8px 32px rgba(0,0,0,.15)}
.fbox h3{font-size:16px;font-weight:600;color:#1a3a8c}
.fbox label{font-size:11px;color:#888;display:block;margin-bottom:3px;font-weight:500}
.fbox input,.fbox textarea{width:100%;padding:9px 10px;border:1.5px solid #ddd;border-radius:8px;font-size:14px;background:#f9f9f7}
.fbox input:focus,.fbox textarea:focus{outline:none;border-color:#1a3a8c}
.fbox textarea{resize:vertical;min-height:60px}
.factions{display:flex;gap:8px;margin-top:4px}
.factions button{flex:1;padding:10px;border-radius:8px;font-size:13px;cursor:pointer;border:1px solid #ddd;font-weight:500}
.factions .confirm{background:#1a3a8c;color:#fff;border-color:#1a3a8c}
.factions .confirm:hover{background:#122870}
.factions .cancel{background:#fff;color:#666}
.inv-note{background:#FEF3E2;border:1px solid #f5c842;border-radius:8px;padding:10px 12px;font-size:11px;color:#7a4f00;line-height:1.5}

/* FOOTER */
.footer{background:#1a3a8c;padding:8px 1rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px}
.footer span{font-size:11px;color:rgba(255,255,255,0.85)}

/* MOBILE */
@media(max-width:600px){
  .hdr{gap:8px;padding:.6rem .75rem}
  .logo-img{height:40px}
  .cbtn span.txt{display:none}
  .layout{flex-direction:column}
  .side{width:100%;height:auto;position:static;border-right:none;border-bottom:1px solid #e5e5e2;padding:.5rem .75rem;display:flex;flex-wrap:wrap;gap:4px;overflow-x:auto;white-space:nowrap}
  .side h4{display:none}
  .sb{display:inline-block;width:auto;padding:5px 10px;border:1px solid #ddd;border-radius:20px;font-size:11px;margin-bottom:0;white-space:nowrap}
  .sb.on{border-color:#1a3a8c}
  .list{max-height:none;padding:.75rem}
  .prow{flex-wrap:wrap;gap:4px;padding:10px 0}
  .pcode{min-width:auto;width:100%;font-size:10px}
  .pname{font-size:13px;width:100%;flex:none}
  .pprice{font-size:14px;font-weight:700}
  .abtn{padding:7px 14px;font-size:12px}
  .cart-panel{display:none}
  .footer{display:none}
  .update-bar{font-size:10px;text-align:center}
}
</style>
